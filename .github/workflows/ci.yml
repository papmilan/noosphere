name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.package }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        package: [noosphere-mcp, noosphere-relayer]

    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.package == 'noosphere-mcp' && 'noosphere-mcp/package-lock.json' || 'noosphere-relayer/npm-shrinkwrap.json' }}

      - run: npm ci

      # noosphere-mcp's tests boot noosphere-relayer's source directly (a
      # monorepo sibling-directory import in lifecycle/relayer-source.js), so
      # the relayer's own dependencies must be installed too or those tests
      # fail with ERR_MODULE_NOT_FOUND and hang waiting on a broken server.
      - if: matrix.package == 'noosphere-mcp'
        working-directory: noosphere-relayer
        run: npm ci

      - run: npm run check

      # SEC-03: both persistence consumers run the shared boundary and their own
      # security suites on every OS. On windows-latest the exact numeric-SID ACL
      # tests execute rather than skip; a skipped Windows security test is not
      # evidence of closure.
      # A skipped or unrun security test is not evidence of closure. Scoped to the
      # security suite: the full relayer suite has pre-existing, non-security Windows
      # failures (POSIX 0o600 mode not enforceable on Windows; local-projects boots
      # noosphere-mcp whose workspace deps this job does not install) that are out of
      # SEC-03 scope and tracked separately.
      - run: npm run test:security

      # SEC-05 Phase 4C: the authority cutover, the restore state machines, and
      # the writer-surface boundary run as their own fail-fast shard on all
      # three platforms. `npm run check` runs these files too, but only after a
      # 600 s-timeout full suite; a boundary breach must fail in seconds, and a
      # platform cell in SEC-05-PHASE-4C-VERIFICATION.md is only evidence if the
      # shard that produced it is named and reproducible.
      - if: matrix.package == 'noosphere-mcp'
        name: SEC-05 Phase 4C trust and restore
        run: >-
          node --test --test-concurrency=1 --test-timeout=1800000
          tests/trust-domain-separation.test.js
          tests/trust-record-splicing.test.js
          tests/trust-concurrency.test.js
          tests/trust-phase4c-cutover.test.js
          tests/trust-revocation.test.js
          tests/trust-migration.test.js
          tests/trust-crash.test.js
          tests/trust-project-binding.test.js
          tests/restore-cli.test.js
          tests/restore-store.test.js
          tests/restore-confirmation.test.js
          tests/restore-apply.test.js
          tests/restore-recovery.test.js
          tests/restore-recovery-cli-crash.test.js
          tests/restore-recovery-cli-convergence.test.js
          tests/restore-recovery-cli-hostile-review.test.js
          tests/restore-recovery-cli-lock-policy.test.js
          tests/restore-receipt.test.js
          tests/restore-boundary.test.js
          tests/operator-docs.test.js
          tests/trust-api-boundary.test.js
          tests/phase4c-conformance.test.js

      # SEC-05 Phase 5: replay identity, recovery, retention, presentation,
      # restore suppression, read-only boundaries, and all 26 deterministic
      # mutants run as one explicit release shard on Linux, macOS, and Windows.
      - if: matrix.package == 'noosphere-mcp'
        name: SEC-05 Phase 5 replay ledger
        run: >-
          node --test --test-concurrency=1 --test-timeout=1800000
          tests/phase5-conformance.test.js
          tests/replay-api-boundary.test.js
          tests/replay-cli-boundary.test.js
          tests/replay-context-refresh.test.js
          tests/replay-crash.test.js
          tests/replay-domain-separation.test.js
          tests/replay-identity-separation.test.js
          tests/replay-identity.test.js
          tests/replay-key-lifecycle.test.js
          tests/replay-lock-hierarchy.test.js
          tests/replay-mutation.test.js
          tests/replay-ordinary-recall.test.js
          tests/replay-production-recovery.test.js
          tests/replay-restore-suppression.test.js
          tests/replay-retention.test.js
          tests/replay-schema.test.js
          tests/replay-state.test.js
          tests/replay-store.test.js

      - run: npm audit --audit-level=high

  project-memory-postgres:
    name: noosphere-remote-mcp-postgres
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noosphere
          POSTGRES_PASSWORD: noosphere
          POSTGRES_DB: noosphere_project_memory
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U noosphere -d noosphere_project_memory"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    defaults:
      run:
        working-directory: noosphere-remote-mcp-postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: noosphere-remote-mcp-postgres/package-lock.json

      - run: npm ci
      - run: npm run test:nodb
      - run: npm run test:db
        env:
          DATABASE_URL: postgres://noosphere:noosphere@127.0.0.1:5433/noosphere_project_memory
      - run: npm audit --audit-level=high

  project-memory-server:
    name: noosphere-remote-mcp-server
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: noosphere-remote-mcp-server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: noosphere-remote-mcp-server/package-lock.json

      - run: npm ci

      # The server test harness reuses the PR3 OIDC verifier via a monorepo
      # sibling-source import, so that package's own dependencies (jose) must be
      # installed too — the same pattern noosphere-mcp uses to boot relayer
      # source above. The server suite itself runs against the in-memory
      # repository, so no PostgreSQL service is needed here.
      - working-directory: noosphere-remote-mcp-postgres
        run: npm ci

      - run: npm test
      - run: npm audit --audit-level=high

  project-memory-acceptance:
    name: noosphere-remote-mcp-acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: noosphere-remote-mcp-acceptance
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: noosphere-remote-mcp-acceptance/package-lock.json

      - run: npm ci

      # The acceptance suite drives the merged PR4 server and reuses the PR3
      # OIDC verifier via monorepo sibling-source imports, so both siblings'
      # dependencies must be installed — the same pattern the server and
      # noosphere-mcp jobs use above. The suite runs against the in-memory
      # repository, so no PostgreSQL service is needed here.
      - working-directory: noosphere-remote-mcp-server
        run: npm ci
      - working-directory: noosphere-remote-mcp-postgres
        run: npm ci

      - run: npm test
      - run: npm audit --audit-level=high

  local-stdio-mcp:
    name: noosphere-local-mcp
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: noosphere-local-mcp
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: noosphere-local-mcp/package-lock.json

      - run: npm ci

      # The Local STDIO package shares the Remote MCP core, and its transport
      # parity suite drives the real Streamable HTTP server (which reuses the
      # PR3 OIDC verifier). Install those siblings' dependencies the same way
      # the acceptance job does. Runs entirely in-memory; no PostgreSQL service.
      - working-directory: noosphere-remote-mcp-server
        run: npm ci
      - working-directory: noosphere-remote-mcp-postgres
        run: npm ci

      - run: npm test
      - run: npm audit --audit-level=high

  security:
    name: Secret and container scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan repository for verified secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --only-verified

      - name: Build production image
        run: docker build -t noosphere-relayer:test noosphere-relayer

      - name: Scan production image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: noosphere-relayer:test
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
